name: android

# App de Android (apps/mobile), igual que en Haze:
# - En cada push a main y PR que toque algo de Android o de la interfaz: tests del plugin y un
#   APK de debug para celulares (solo arm64, para que sea rapido), que queda como artefacto.
# - Al etiquetar vX.Y.Z: compila el APK de release firmado y lo suma al Release de esa version
#   con latest-android.json, que es lo que consultan las apps instaladas para actualizarse. El
#   mismo tag dispara desktop.yml, que sube el instalador de Windows.
#
#     git tag v0.3.0
#     git push origin v0.3.0
#
# El APK de release es universal: arm64-v8a (celulares) y armeabi-v7a (TV box y celulares de 32
# bits, ver docs/mobile.md "TV"). Un solo APK con las dos: mismo versionCode y la misma firma, asi
# las apps instaladas se siguen actualizando solas.
#
# El APK es generico: no lleva la direccion del server (el repo y los Releases son publicos).
# La app la pide la primera vez. Por eso VITE_DEFAULT_SERVER va vacio a proposito.
# Los filtros de carpetas no aplican a los tags: un tag v* siempre compila.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/local-server/**'
      - 'backend/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/release.sh'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'apps/local-server/**'
      - 'backend/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/release.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests y APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      VITE_DEFAULT_SERVER: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund --prefix apps/web
          npm ci --no-audit --no-fund --prefix apps/mobile

      # El plugin depende de Tauri, y sus tests corren en Linux: hacen falta GTK y WebKit.
      # En los tags no se repiten: ya corrieron con el push a main.
      - name: Librerias de Tauri para Linux
        if: env.RELEASE != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Tests del plugin
        if: env.RELEASE != 'true'
        working-directory: apps/mobile/src-tauri
        run: cargo test -p tauri-plugin-mythos

      - name: APK de debug
        if: env.RELEASE != 'true'
        working-directory: apps/mobile
        # El runner trae el SDK y el NDK de Android instalados.
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --debug --target aarch64 --apk

      - uses: actions/upload-artifact@v4
        if: env.RELEASE != 'true'
        with:
          name: mythos-android-debug
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

      # ------------------------------------------------------------------ release

      - name: Version desde el tag
        if: env.RELEASE == 'true'
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "El tag '$GITHUB_REF_NAME' no tiene la forma vMAYOR.MENOR.PARCHE" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # La keystore va como secrets (Settings > Secrets > Actions), en base64. Todas las
      # versiones se firman con la misma: con otra, Android no instala encima.
      - name: Keystore
        if: steps.version.outputs.version
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Faltan los secrets de la keystore: sin firma no se puede publicar (ver docs/mobile.md)." >&2
            exit 1
          fi
          GEN=apps/mobile/src-tauri/gen/android
          echo "$KEYSTORE" | base64 -d > "$GEN/mythos.jks"
          {
            echo "storeFile=mythos.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > "$GEN/keystore.properties"

      - name: APK firmado
        if: steps.version.outputs.version
        working-directory: apps/mobile
        run: |
          V="${{ steps.version.outputs.version }}"
          # La version sale del tag; Tauri arma el versionCode con ella.
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --target aarch64 armv7 --apk --config "{\"version\":\"$V\"}"

      - name: Publicar el Release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          APK=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No se genero el APK de release" >&2
            exit 1
          fi
          # Tiene que traer las dos ABIs (celulares de 64 bits y TV box de 32).
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$ABI/libmythos_mobile_lib.so" || { echo "El APK no trae lib/$ABI" >&2; exit 1; }
          done
          cp "$APK" "Mythos-$V-android.apk"
          SHA=$(sha256sum "Mythos-$V-android.apk" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Mythos-$V-android.apk"
          node -e '
            const [version, url, sha256] = process.argv.slice(1);
            require("fs").writeFileSync("latest-android.json", JSON.stringify({ version, url, sha256, pub_date: new Date().toISOString() }, null, 2));
          ' "$V" "$URL" "$SHA"
          bash .github/scripts/release.sh "$V" "Mythos-$V-android.apk" latest-android.json
