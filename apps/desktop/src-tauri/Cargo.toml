[package]
name = "mythos-desktop"
version = "0.2.0"
description = "Mythos: la ventana de escritorio (carga la interfaz de apps/web)"
edition = "2021"

[lib]
name = "mythos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
