[package]
name = "mythos-desktop"
version = "0.19.0"
description = "Mythos: la ventana de escritorio (carga la interfaz de apps/web)"
edition = "2021"

[lib]
name = "mythos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
# El server embebido del modo local (docs/local-mode.md).
tauri-plugin-mythos-local = { path = "../../local-server" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
