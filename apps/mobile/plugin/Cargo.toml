[package]
name = "tauri-plugin-mythos"
version = "0.5.0"
description = "Mythos en Android: el server elegido, pantalla completa, pantalla encendida y actualizaciones"
edition = "2021"
links = "tauri-plugin-mythos"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
