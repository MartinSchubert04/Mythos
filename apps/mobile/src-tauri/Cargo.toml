[package]
name = "mythos-mobile"
version = "0.4.0"
description = "Mythos para Android: el shell de Tauri que abre la interfaz del server"
edition = "2021"

[lib]
name = "mythos_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-mythos = { path = "../plugin" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
