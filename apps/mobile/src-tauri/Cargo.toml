[package]
name = "mythos-mobile"
version = "0.22.0"
description = "Mythos para Android: el shell de Tauri que abre la interfaz del server"
edition = "2021"

[lib]
name = "mythos_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-mythos = { path = "../plugin" }
# El server embebido del modo local (docs/local-mode.md).
tauri-plugin-mythos-local = { path = "../../local-server" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
