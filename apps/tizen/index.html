<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La pagina local de la app de Samsung (docs/tizen.md): elige el server y abre su interfaz.
         Los textos van en español; con la tele en ingles, shell.js pone los de data-t en ingles. -->
    <meta name="viewport" content="width=960" />
    <title>Mythos</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main class="box">
      <img class="logo" src="icon.png" alt="" />
      <h1>Mythos</h1>

      <section id="connecting" hidden>
        <p class="lead" id="connecting-text">Conectando…</p>
        <button class="btn" id="change" data-t="change">Cambiar de servidor</button>
      </section>

      <section id="setup" hidden>
        <p class="lead" data-t="setupLead">Escribí la dirección de tu servidor de Mythos en la red de tu casa.</p>
        <label class="field">
          <span data-t="addrLabel">Dirección del servidor</span>
          <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="http://192.168.x.x:7700" />
        </label>
        <p class="hint" data-t="addrHint">Sin <b>http://</b> ni puerto, usa <b>http://</b> y <b>:7700</b>. La tele no puede usar Tailscale: usá la dirección del servidor en tu casa.</p>
        <p class="error" id="error" role="alert"></p>
        <div class="row">
          <button class="btn primary" id="connect" data-t="connect">Conectar</button>
          <button class="btn" id="find" data-t="find">Buscar en esta red</button>
        </div>
        <div class="found" id="found"></div>
      </section>

      <section id="old" hidden>
        <p class="lead" id="old-text"></p>
      </section>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
