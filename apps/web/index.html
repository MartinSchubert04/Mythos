<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- La app de Android solo abre la interfaz de un server que trae esto (ver lib/shell.svelte.ts). -->
    <meta name="mythos-shell" content="1" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Mythos</title>
    <script>
      // Navegador o WebView demasiado viejo (docs/mobile.md, "WebView"). Este script tiene que
      // andar en cualquier Chrome (los TV box traen WebView 66 o asi): ES5 puro, nada de flechas,
      // let, template strings ni ?. / ??. La interfaz pide Chromium 111 (color-mix en todos los
      // colores, :has, AbortSignal.timeout); con uno mas viejo el modulo de la app ni compila y
      // quedaria la pantalla en blanco. Por eso el modulo no va en el HTML: lo carga mythosBoot
      // (el plugin `gate` de vite.config.ts cambia el script de tipo module por la llamada) solo
      // si la version alcanza. Si no, una pantalla que explica como actualizar.
      // Firefox (motor propio, sin WebView: la alternativa en un TV box con WebView viejo) pide la
      // 121 (:has); Safari no dice "Chrome/" ni "Firefox/" y pasa siempre.
      // Para probarla: http://localhost:5173/?webviewTest=66 (solo en localhost).
      (function () {
        var MIN = 111;
        var MIN_FIREFOX = 121;
        var ua = navigator.userAgent;
        var m = /Chrom(?:e|ium)\/(\d+)/.exec(ua);
        var ff = m ? null : /Firefox\/(\d+)/.exec(ua);
        var v = m ? parseInt(m[1], 10) : 0;
        var test = /[?&]webviewTest=(\d+)/.exec(location.search);
        if (test && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) v = parseInt(test[1], 10);
        var old = v > 0 && v < MIN;
        if (ff && parseInt(ff[1], 10) < MIN_FIREFOX) {
          old = true;
          v = parseInt(ff[1], 10);
          MIN = MIN_FIREFOX;
        }

        window.mythosBoot = function (src) {
          if (old) return;
          function load() {
            var s = document.createElement("script");
            s.type = "module";
            s.crossOrigin = "anonymous";
            s.src = src;
            document.head.appendChild(s);
          }
          // main.ts monta en #app: se espera al <body>.
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
          else load();
        };
        if (!old) return;

        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        var android = /Android/i.test(ua) && !ff;
        var webview = android && (/; wv\)/.test(ua) || /Version\/\d/.test(ua));
        // Idioma: el elegido en la app (mythos.lang, lib/i18n.svelte.ts) o, la primera vez, el del
        // sistema: español salvo que el sistema este en ingles.
        var lang = "";
        try {
          lang = localStorage.getItem("mythos.lang") || "";
        } catch (e) {}
        if (lang !== "es" && lang !== "en") lang = /^en/i.test(navigator.language || "") ? "en" : "es";
        document.documentElement.lang = lang;
        var T =
          lang === "en"
            ? {
                titleFf: "Update Firefox",
                titleAndroid: "Update Android System WebView",
                titleOther: "Update your browser",
                leadFf: "Mythos needs a newer Firefox than this one.",
                leadAndroid: "Mythos needs a newer Android System WebView than the one on this device.",
                leadOther: "Mythos needs a newer browser than this one.",
                stepsFf: ["Update Firefox to the latest version (Google Play, or the latest APK with the Downloader app or from a USB drive).", "Reload this page."],
                stepsAndroid: [
                  "Open Google Play, search for <b>Android System WebView</b> and tap <b>Update</b>.",
                  "No Google Play? Install the latest <b>Android System WebView</b> APK for this device (armeabi-v7a or arm64-v8a) with the Downloader app or from a USB drive.",
                  "If the update doesn't take effect, choose it in <b>Settings &rarr; Developer options &rarr; WebView implementation</b>. To show Developer options: <b>Settings &rarr; About</b> and tap <b>Build</b> seven times.",
                  "Open Mythos again.",
                  "Can't update it? Use <b>Firefox</b> instead: install Firefox for Android (Google Play, the Downloader app or a USB drive), open the address of your Mythos server there (the same one you use on your phone) and sign in. On a TV box Mythos turns on TV mode by itself.",
                ],
                stepsOther: ["Update Chrome, Edge or your browser to the latest version.", "Reload this page."],
                engineWebview: "WebView on this device: ",
                engineBrowser: "Browser on this device: ",
                required: ". Required: ",
                orNewer: " or newer.",
              }
            : {
                titleFf: "Actualizá Firefox",
                titleAndroid: "Actualizá Android System WebView",
                titleOther: "Actualizá el navegador",
                leadFf: "Mythos necesita un Firefox más nuevo que este.",
                leadAndroid: "Mythos necesita un Android System WebView más nuevo que el de este dispositivo.",
                leadOther: "Mythos necesita un navegador más nuevo que este.",
                stepsFf: ["Actualizá Firefox a la última versión (Google Play, o el último APK con la app Downloader o desde un pendrive).", "Volvé a cargar esta página."],
                stepsAndroid: [
                  "Abrí Google Play, buscá <b>Android System WebView</b> y tocá <b>Actualizar</b>.",
                  "¿No tenés Google Play? Instalá el último APK de <b>Android System WebView</b> para este dispositivo (armeabi-v7a o arm64-v8a) con la app Downloader o desde un pendrive.",
                  "Si la actualización no se aplica, elegila en <b>Ajustes &rarr; Opciones para desarrolladores &rarr; Implementación de WebView</b>. Para ver las Opciones para desarrolladores: <b>Ajustes &rarr; Acerca del dispositivo</b> y tocá <b>Número de compilación</b> siete veces.",
                  "Volvé a abrir Mythos.",
                  "¿No se puede actualizar? Usá <b>Firefox</b>: instalá Firefox para Android (Google Play, la app Downloader o un pendrive), abrí ahí la dirección de tu servidor de Mythos (la misma que usás en el celular) y entrá. En un TV box, Mythos pone solo el modo TV.",
                ],
                stepsOther: ["Actualizá Chrome, Edge o tu navegador a la última versión.", "Volvé a cargar esta página."],
                engineWebview: "WebView de este dispositivo: ",
                engineBrowser: "Navegador de este dispositivo: ",
                required: ". Hace falta: ",
                orNewer: " o más nuevo.",
              };
        var title = ff ? T.titleFf : android ? T.titleAndroid : T.titleOther;
        var lead = ff ? T.leadFf : android ? T.leadAndroid : T.leadOther;
        var steps = ff ? T.stepsFf : android ? T.stepsAndroid : T.stepsOther;
        var list = "";
        for (var i = 0; i < steps.length; i++) {
          list += '<li style="margin:0 0 10px 0;padding:0">' + steps[i] + "</li>";
        }
        var html =
          '<div style="max-width:640px;margin:0 auto;padding:40px 24px">' +
          '<div style="font-size:15px;font-weight:bold;letter-spacing:1px;color:#6ee7b7;margin:0 0 18px 0">MYTHOS</div>' +
          '<h1 style="font-size:26px;line-height:1.25;margin:0 0 12px 0;font-weight:bold">' + esc(title) + "</h1>" +
          '<p style="font-size:17px;line-height:1.5;margin:0 0 18px 0;color:#c4c8d0">' + esc(lead) + "</p>" +
          '<ol style="font-size:17px;line-height:1.5;margin:0 0 22px 0;padding:0 0 0 24px">' + list + "</ol>" +
          '<p style="font-size:14px;line-height:1.5;margin:0;color:#8b92a0">' +
          (webview ? T.engineWebview : T.engineBrowser) + (ff ? "Firefox " : "Chromium ") + esc(v) + T.required +
          (ff ? "Firefox " : "Chromium ") + MIN + T.orNewer + "</p>" +
          "</div>";

        function show() {
          var box = document.createElement("div");
          box.id = "mythos-outdated";
          box.setAttribute("role", "alert");
          box.style.cssText =
            "position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;overflow:auto;" +
            "background:#0d0f14;color:#e7e9ee;font-family:sans-serif;-webkit-user-select:text;user-select:text";
          box.innerHTML = html;
          document.body.appendChild(box);
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show);
        else show();
      })();
    </script>
    <script>
      // El tema se aplica antes de pintar (sin parpadeo). Mismas claves que src/lib/themes.ts.
      // Modo TV (lib/tv.svelte.ts, guardado del arranque anterior): la escala de 10 pies desde el
      // primer cuadro.
      try {
        var t = localStorage.getItem("mythos.theme") || "neovim"; // DEFAULT_THEME de src/lib/themes.ts
        var d = document.documentElement;
        var lang = localStorage.getItem("mythos.lang"); // lib/i18n.svelte.ts (por defecto, español)
        if (lang === "en" || lang === "es") d.lang = lang;
        d.dataset.theme = t;
        d.dataset.palette = localStorage.getItem("mythos.palette." + t) || "";
        if (JSON.parse(localStorage.getItem("mythos.prefs") || "{}").reduceMotion) d.setAttribute("data-reduce-motion", "");
        if (localStorage.getItem("mythos.tv") === "1") {
          d.setAttribute("data-tv", "");
          if (Math.max(screen.width, window.innerWidth) > 960)
            document.querySelector('meta[name="viewport"]').setAttribute("content", "width=960, viewport-fit=cover");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
