# Mythos en el server. Red del host (`network_mode: host`) para que el motor de torrents pueda usar
# UPnP y el DHT (que abre un puerto UDP aleatorio); la app escucha por defecto solo en 127.0.0.1:7700
# y afuera se ve por `tailscale serve`. Los peers entran por 42069 TCP/UDP. Ver deploy/README.md.
services:
  mythos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mythos:latest
    container_name: mythos
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      # Solo localhost (tailscale serve lo publica). Para la red de casa no se usa 0.0.0.0: choca con
      # el 7700 que ocupa tailscale serve en la IP de la tailnet. Va MYTHOS_EXTRA_BIND en .env.
      MYTHOS_BIND: 127.0.0.1:7700
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]
    healthcheck:
      # `mythos health` pide /api/health a 127.0.0.1 en el puerto de MYTHOS_BIND.
      test: ["CMD", "mythos", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
